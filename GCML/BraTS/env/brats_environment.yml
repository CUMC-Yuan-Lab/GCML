# Environment for the GCML BraTS demo (training and testing).
# Python 3.10 with PyTorch 2.0.1 (CUDA 11.7 wheels, so a CUDA-capable GPU and driver are needed).
# The versions are the ones the demo was developed and tested with.
name: brats
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
    # packages imported by the demo code
    - torch==2.0.1
    - torchinfo==1.8.0
    - numpy==1.22.3
    - scipy==1.11.1
    - pandas==2.0.3
    - scikit-image==0.21.0
    - simpleitk==2.2.1
    - batchgenerators==0.25
    - tqdm==4.65.0
    - pynvml==11.5.0
    # required by torch
    - filelock==3.11.0
    - jinja2==3.1.2
    - markupsafe==2.1.3
    - networkx==3.1
    - sympy==1.12
    - mpmath==1.3.0
    - typing-extensions==4.7.1
    - triton==2.0.0
    - cmake==3.27.0
    - lit==16.0.6
    - nvidia-cublas-cu11==11.10.3.66
    - nvidia-cuda-cupti-cu11==11.7.101
    - nvidia-cuda-nvrtc-cu11==11.7.99
    - nvidia-cuda-runtime-cu11==11.7.99
    - nvidia-cudnn-cu11==8.5.0.96
    - nvidia-cufft-cu11==10.9.0.58
    - nvidia-curand-cu11==10.2.10.91
    - nvidia-cusolver-cu11==11.4.0.1
    - nvidia-cusparse-cu11==11.7.4.91
    - nvidia-nccl-cu11==2.14.3
    - nvidia-nvtx-cu11==11.7.91
    # required by scikit-image
    - imageio==2.31.1
    - lazy-loader==0.3
    - packaging==23.1
    - pillow==10.0.0
    - pywavelets==1.4.1
    - tifffile==2023.7.18
    # required by batchgenerators
    - scikit-learn==1.3.0
    - joblib==1.3.1
    - threadpoolctl==3.2.0
    - future==0.18.3
    - unittest2==1.1.0
    - argparse==1.4.0
    - linecache2==1.0.0
    - traceback2==1.4.0
    - six==1.16.0
    # required by pandas
    - python-dateutil==2.8.2
    - pytz==2023.3
    - tzdata==2023.3
    # other dependencies
    - cloudpickle==2.2.1
